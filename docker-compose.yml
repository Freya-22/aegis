# Local SIEM: Splunk with HTTP Event Collector (HEC) enabled.
# Web UI: http://localhost:8000 (admin / $SPLUNK_PASSWORD)
# HEC:    http://localhost:8088/services/collector/event
services:
  splunk:
    image: splunk/splunk:latest
    container_name: aegis-splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_HEC_SSL: "false"  # plain HTTP is fine on localhost; use TLS in any real deployment
    ports:
      - "8000:8000"
      - "8088:8088"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc

volumes:
  splunk-var:
  splunk-etc:
